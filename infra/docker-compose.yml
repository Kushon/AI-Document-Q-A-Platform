services:

  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (объектное хранилище) ─────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: rag_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web-консоль
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Qdrant (векторная БД) ────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis / Valkey (кэш) ────────────────────────────────────
  redis:
    image: valkey/valkey:7-alpine
    container_name: rag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka (KRaft — без Zookeeper) ──────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: rag_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT — для хоста (localhost:9092)
      # INTERNAL  — для контейнеров внутри docker сети (kafka:29092)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Kafka UI (опционально, для отладки) ────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rag_kafka_ui
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8080:8080"

  # ─── API Gateway (nginx) ────────────────────────────────────
  gateway:
    image: nginx:alpine
    container_name: rag_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:8080"   # Streamlit UI
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - document-service
      - query-service
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── frontend (Streamlit) ───────────────────────────────────
  frontend:
    build:
      context: ../services/frontend
      dockerfile: Dockerfile
    container_name: rag_frontend
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://gateway:80

  # ─── query-service ──────────────────────────────────────────
  query-service:
    build:
      context: ../services/query-service
      dockerfile: Dockerfile
    container_name: rag_query_service
    restart: unless-stopped
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    ports:
      - "8004:8000"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  # ─── embedding-service ──────────────────────────────────────
  embedding-service:
    build:
      context: ../services/embedding-service
      dockerfile: Dockerfile
    container_name: rag_embedding_service
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      MINIO_HOST: minio
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      QDRANT_HOST: qdrant
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      qdrant:
        condition: service_started

  # ─── document-service ───────────────────────────────────────
  document-service:
    build:
      context: ../services/document-service
      dockerfile: Dockerfile
    container_name: rag_document_service
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      MINIO_HOST: minio
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ─── user-service ────────────────────────────────────────────
  user-service:
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    container_name: rag_user_service
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
  redis_data:
  kafka_data:
