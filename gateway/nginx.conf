events {
    worker_connections 1024;
}

http {

    # ─── Rate limiting ────────────────────────────────────────────
    # 10 запросов в минуту на IP для /query
    limit_req_zone $binary_remote_addr zone=query_limit:10m rate=10r/m;

    # ─── Upstream — балансировка нагрузки ────────────────────────
    # Каждый upstream может содержать несколько реплик
    upstream user_service {
        server user-service:8000;
    }

    upstream document_service {
        server document-service:8000;
    }

    upstream query_service {
        server query-service:8000;
    }

    upstream frontend {
        server frontend:8501;
    }

    # ─── Основной сервер ──────────────────────────────────────────
    server {
        listen 80;

        # Проброс заголовков
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Authorization     $http_authorization;

        # Таймауты
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        # Auth
        location /auth/ {
            proxy_pass http://user_service;
        }

        # Документы (лимит размера файла 50 МБ)
        location /documents/ {
            client_max_body_size 50m;
            proxy_pass http://document_service;
        }

        # Запросы — с rate limiting (10 req/min, burst 5)
        location /query/ {
            limit_req zone=query_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://query_service;
        }

        # Healthcheck самого gateway
        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ─── Streamlit UI — порт 8080 ─────────────────────────────────
    server {
        listen 8080;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;
        }

        # Streamlit WebSocket endpoint
        location /_stcore/stream {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
    }
}
