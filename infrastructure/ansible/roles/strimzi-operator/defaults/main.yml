---
# Версия Strimzi operator (KRaft mode стабилен с 0.43+).
strimzi_operator_version: "0.45.0"

# Namespace, где будут жить operator и кластер Kafka.
strimzi_namespace: "kafka"

# Куда роль рендерит сгенерированный ArgoCD Application
# (после этого ArgoCD сам ставит Helm chart Strimzi-оператора).
# Application для оператора — bootstrap-уровень (применяется напрямую,
# рядом с root-app). Это даёт CRDs появиться до того, как ArgoCD синкнет
# Kafka cluster/topics из gitops/platform/strimzi/.
strimzi_gitops_dir: "{{ playbook_dir }}/../../../gitops/bootstrap"

# Helm chart Strimzi. Используем HTTPS-репозиторий (ArgoCD на стабильно
# работает с OCI на quay.io — кешируется как "object required" ошибка).
strimzi_helm_repo:  "https://strimzi.io/charts/"
strimzi_helm_chart: "strimzi-kafka-operator"
