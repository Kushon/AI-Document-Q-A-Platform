# Strimzi Operator + Kafka Cluster.
# Манифесты в gitops/platform/strimzi/ генерируются Ansible-ролью (Задание 2.3).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Kushon/AI-Document-Q-A-Platform.git
    targetRevision: feature/k8s-platform
    path: gitops/platform/strimzi
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true   # KafkaCluster CRD большой, server-side apply надёжнее
