# ArgoCD Application для установки Strimzi-оператора через Helm chart.
# Сгенерирован Ansible-ролью infrastructure/ansible/roles/strimzi-operator.
# Не редактировать вручную: правки делать в роли и пере-запускать playbook.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # ставится раньше Kafka CR
spec:
  project: default
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: "0.45.0"
    helm:
      releaseName: strimzi-operator
      values: |
        # watchAnyNamespace=false + не указываем watchNamespaces → оператор
        # watch'ит только namespace где он сам живёт (= kafka).
        # Иначе чарт дублирует namespace в STRIMZI_NAMESPACE env.
        watchAnyNamespace: false
        # JVM по дефолту использует -XX:MaxRAMPercentage=20:
        # с 1Gi лимита heap = 200Mi → OOM при старте.
        # Поднимаем memory до 2Gi → 400Mi heap.
        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            cpu: "1"
            memory: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
