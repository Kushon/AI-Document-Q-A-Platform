# ArgoCD Application для установки Strimzi-оператора через Helm chart.
# Сгенерирован Ansible-ролью infrastructure/ansible/roles/strimzi-operator.
# Не редактировать вручную: правки делать в роли и пере-запускать playbook.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # ставится раньше Kafka CR
spec:
  project: default
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: "0.45.0"
    helm:
      releaseName: strimzi-operator
      values: |
        watchAnyNamespace: false
        watchNamespaces:
          - kafka
        # Ресурсы для k3d — поднял после Vertx "Thread blocked" на 100m CPU
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
