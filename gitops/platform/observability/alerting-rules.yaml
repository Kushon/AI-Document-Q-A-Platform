# vmalert правила для алертинга. Применяются через VMRule CR (VictoriaMetrics
# operator). На локальном dev — vmalert читает их из ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: monitoring
  labels:
    vmalert-rules: "true"
data:
  pi-platform.rules: |
    groups:
      - name: pi-platform-alerts
        interval: 30s
        rules:
          - alert: HighQueryLatency
            expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="query-service"}[5m]))) > 5
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "Query-service p95 latency > 5s"
              description: "{{ $labels.instance }} p95={{ $value }}s"

          - alert: KafkaConsumerLag
            expr: kafka_consumergroup_lag > 1000
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "Kafka consumer lag > 1000"
              description: "topic={{ $labels.topic }} group={{ $labels.consumergroup }} lag={{ $value }}"

          - alert: RateLimitTriggered
            expr: sum(rate(envoy_http_local_rate_limit_rate_limited[1m])) > 100/60
            for: 1m
            labels: { severity: info }
            annotations:
              summary: "Rate limiter возвращает > 100 429-ответов в минуту"

          - alert: ServiceDown
            expr: up{job=~"user-service|document-service|query-service|embedding-service"} == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "Сервис {{ $labels.job }} не отвечает"

          - alert: CircuitBreakerOpen
            expr: increase(envoy_cluster_outlier_detection_ejections_active[5m]) > 0
            for: 30s
            labels: { severity: warning }
            annotations:
              summary: "Istio Circuit Breaker открылся"
              description: "cluster={{ $labels.envoy_cluster_name }}"
