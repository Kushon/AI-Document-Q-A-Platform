# Strimzi KafkaCluster в KRaft mode.
# Сгенерирован Ansible-ролью infrastructure/ansible/roles/kafka.
---
# KafkaNodePool: controllers (для маленького кластера combined с брокерами не нужен,
# но KafkaNodePool обязателен в KRaft).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controller
  namespace: kafka
  labels:
    strimzi.io/cluster: pi-kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # после установки Strimzi CRDs
spec:
  replicas: 1
  roles:
    - controller
    - broker          # combined mode для локального dev
  storage:
    type: ephemeral
  resources:
    requests:
      cpu: "200m"
      memory: "768Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
---
# Kafka cluster (KRaft mode без Zookeeper)
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: pi-kafka
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
    argocd.argoproj.io/sync-wave: "1"   # после установки Strimzi CRDs
spec:
  kafka:
    version: "3.9.0"
    metadataVersion: "3.9-IV0"
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
    jvmOptions:
      "-Xms": "512m"
      "-Xmx": "512m"
