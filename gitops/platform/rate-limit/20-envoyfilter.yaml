# EnvoyFilter — подключает Envoy Rate Limit Service к Istio IngressGateway.
# Два патча:
#   1. CLUSTER  — регистрирует ratelimit как upstream cluster в Envoy
#   2. HTTP_FILTER — вставляет rate_limit фильтр в цепочку перед роутингом
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: ratelimit-filter
  namespace: istio-system
spec:
  workloadSelector:
    labels: { istio: ingressgateway }
  configPatches:
    # 1. Регистрируем ratelimit cluster
    - applyTo: CLUSTER
      match:
        cluster: { service: ratelimit.rate-limit.svc.cluster.local }
      patch:
        operation: ADD
        value:
          name: rate_limit_cluster
          type: STRICT_DNS
          connect_timeout: 1s
          lb_policy: ROUND_ROBIN
          http2_protocol_options: {}
          load_assignment:
            cluster_name: rate_limit_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: ratelimit.rate-limit.svc.cluster.local
                          port_value: 8081

    # 2. Включаем rate_limit фильтр в HTTP цепочке
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter: { name: "envoy.filters.http.router" }
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.ratelimit
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
            domain: pi-gateway
            failure_mode_deny: false   # при недоступности RLS не блокировать
            timeout: 0.5s
            rate_limited_as_resource_exhausted: true
            enable_x_ratelimit_headers: DRAFT_VERSION_03
            rate_limit_service:
              grpc_service:
                envoy_grpc: { cluster_name: rate_limit_cluster }
              transport_api_version: V3
---
# VirtualService action — для каких маршрутов поднимать rate limit.
# Сопоставляется с descriptors в ratelimit-config (path_method + remote_address).
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: ratelimit-actions
  namespace: istio-system
spec:
  workloadSelector:
    labels: { istio: ingressgateway }
  configPatches:
    - applyTo: VIRTUAL_HOST
      match:
        context: GATEWAY
        routeConfiguration:
          vhost: { name: "*:80" }
      patch:
        operation: MERGE
        value:
          rate_limits:
            - actions:
                - request_headers:
                    header_name: ":path"
                    descriptor_key: path_method
                - remote_address: {}
