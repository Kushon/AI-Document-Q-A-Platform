# Envoy Rate Limit Service (envoyproxy/ratelimit).
# Считывает правила из ConfigMap, использует Valkey как backend для счётчиков.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratelimit
  namespace: rate-limit
spec:
  replicas: 1
  selector: { matchLabels: { app: ratelimit } }
  template:
    metadata:
      labels: { app: ratelimit }
    spec:
      containers:
        - name: ratelimit
          image: envoyproxy/ratelimit:master
          command: ["/bin/ratelimit"]
          env:
            - { name: USE_STATSD,      value: "false" }
            - { name: LOG_LEVEL,       value: "info" }
            - { name: REDIS_SOCKET_TYPE, value: "tcp" }
            - { name: REDIS_URL,       value: "ratelimit-valkey.rate-limit.svc.cluster.local:6379" }
            - { name: RUNTIME_ROOT,    value: "/data" }
            - { name: RUNTIME_SUBDIRECTORY, value: "ratelimit" }
            - { name: RUNTIME_WATCH_ROOT,   value: "false" }
            - { name: RUNTIME_IGNOREDOTFILES, value: "true" }
          ports:
            - { containerPort: 8081, name: grpc }
            - { containerPort: 6070, name: http-debug }
          volumeMounts:
            - { name: config, mountPath: /data/ratelimit/config }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
      volumes:
        - name: config
          configMap: { name: ratelimit-config }
---
apiVersion: v1
kind: Service
metadata:
  name: ratelimit
  namespace: rate-limit
spec:
  selector: { app: ratelimit }
  ports:
    - { name: grpc, port: 8081, targetPort: 8081 }
