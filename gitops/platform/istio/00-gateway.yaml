# Istio Gateway — точка входа для трафика в mesh.
# Слушает на ingress-gateway service, маршрутизация по hosts/paths
# делается через VirtualService'ы дальше.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pi-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
